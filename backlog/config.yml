project_name: "until"
default_status: "To Do"
statuses: ["To Do", "Ready", "In Progress", "In Review", "Done"]
labels: ["Sprint1", "Sprint2", "Sprint3", "Sprint4", "Sprint5", "Sprint6", "Sprint7", "Sprint8"]
date_format: yyyy-mm-dd
max_column_width: 20
