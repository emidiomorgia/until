server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # The installed PWA launches directly at /app. Keep both forms on the
    # SPA entry point so a server-side request never depends on client-side
    # React Router navigation having happened first.
    location = /app {
        try_files /index.html =404;
    }

    location = /app/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
